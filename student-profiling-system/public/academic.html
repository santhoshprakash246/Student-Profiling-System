<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Records</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark" style="background:#273DB4">
    <div class="container-fluid">
        <a href="dashboard.html" class="navbar-brand">Faculty Dashboard</a>
        <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container py-4">

    <h2>Academic Records</h2>

    <div id="message" class="mt-3"></div>

    <div class="card p-4 mt-3">
        <h4>Select Student</h4>

        <select id="studentSelect" class="form-select">
            <option value="">Select student</option>
        </select>

        <hr>

        <h4>Add / Update Semester</h4>

        <form id="academicForm">
            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Semester</label>
                    <input id="semester" type="number" min="1" max="12"
                           class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">SGPA</label>
                    <input id="sgpa" type="number" min="0" max="10"
                           step="0.01" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">CGPA</label>
                    <input id="cgpa" type="number" min="0" max="10"
                           step="0.01" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Attendance (%)</label>
                    <input id="attendance" type="number" min="0" max="100"
                           class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Pending Arrears</label>
                    <input id="arrears" type="number" min="0"
                           class="form-control" value="0" required>
                </div>

            </div>

            <button class="btn btn-primary mt-3" type="submit">
                Save Academic Record
            </button>
        </form>
    </div>

    <div class="card p-4 mt-4">
        <h4>Semester Records</h4>

        <div class="table-responsive">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Semester</th>
                        <th>SGPA</th>
                        <th>CGPA</th>
                        <th>Attendance</th>
                        <th>Arrears</th>
                    </tr>
                </thead>
                <tbody id="academicTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="app.js"></script>

<script>
if (!getToken() || currentUser()?.role !== "faculty") {
    window.location.replace("/index.html");
}

function logout() {
    localStorage.removeItem("authToken");
    localStorage.removeItem("authUser");
    window.location.replace("/index.html");
}

function message(text, type = "success") {
    document.getElementById("message").innerHTML =
        `<div class="alert alert-${type}">${text}</div>`;
}

async function loadStudents() {
    const result = await api("/api/students");

    const students = Array.isArray(result)
        ? result
        : result.students || result.data || [];

    const select = document.getElementById("studentSelect");

    students.forEach(s => {
        const option = document.createElement("option");
        option.value = s._id;
        option.textContent = `${s.name} (${s.registerNumber})`;
        option.dataset.register = s.registerNumber;
        select.appendChild(option);
    });
}

async function loadAcademic() {
    const id = document.getElementById("studentSelect").value;
    const table = document.getElementById("academicTable");

    table.innerHTML = "";

    if (!id) return;

    const result = await api(`/api/students/${id}`);

    const student = result.student || result.data || result;

    const semesters = student.semesters || [];

    semesters.forEach(s => {
        const tr = document.createElement("tr");

        [
            s.semester,
            s.sgpa,
            s.cgpa,
            s.attendance,
            s.arrears
        ].forEach(value => {
            const td = document.createElement("td");
            td.textContent = value ?? "";
            tr.appendChild(td);
        });

        table.appendChild(tr);
    });
}

document.getElementById("studentSelect")
    .addEventListener("change", loadAcademic);

document.getElementById("academicForm").onsubmit = async function(e) {
    e.preventDefault();

    const id = document.getElementById("studentSelect").value;

    if (!id) {
        message("Select a student first", "warning");
        return;
    }

    const record = {
        semester: Number(document.getElementById("semester").value),
        sgpa: Number(document.getElementById("sgpa").value),
        cgpa: Number(document.getElementById("cgpa").value),
        attendance: Number(document.getElementById("attendance").value),
        arrears: Number(document.getElementById("arrears").value)
    };

    const result = await api(
        `/api/students/${id}/semesters`,
        "POST",
        record
    );

    if (!result.success) {
        message(result.message || "Unable to save academic record", "danger");
        return;
    }

    message("Academic record saved");
    this.reset();
    loadAcademic();
};

loadStudents();
</script>

</body>
</html>
