<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Profiles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark" style="background:#273DB4">
    <div class="container-fluid">
        <a href="dashboard.html" class="navbar-brand">Faculty Dashboard</a>
        <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container py-4">

    <h2>Career Profiles</h2>

    <div id="message" class="mt-3"></div>

    <div class="card p-4 mt-3">
        <label class="form-label">Select Student</label>
        <select id="studentSelect" class="form-select">
            <option value="">Select student</option>
        </select>
    </div>

    <div class="card p-4 mt-4">
        <h4>Career Details</h4>

        <form id="careerForm">

            <div class="mb-3">
                <label class="form-label">Technical Skills</label>
                <textarea id="skills" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Certifications</label>
                <textarea id="certifications" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Projects</label>
                <textarea id="projects" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">GitHub URL</label>
                <input id="github" type="url" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">LinkedIn URL</label>
                <input id="linkedin" type="url" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Career Goal</label>
                <select id="careerGoal" class="form-select">
                    <option value="">Select career goal</option>
                    <option value="Placement">Placement</option>
                    <option value="Higher Studies">Higher Studies</option>
                    <option value="Entrepreneurship">Entrepreneurship</option>
                </select>
            </div>

            <button class="btn btn-primary" type="submit">
                Save Career Profile
            </button>

        </form>
    </div>

</div>

<script src="app.js"></script>

<script>
if (!getToken() || currentUser()?.role !== "faculty") {
    window.location.replace("/index.html");
}

function logout() {
    localStorage.removeItem("authToken");
    localStorage.removeItem("authUser");
    window.location.replace("/index.html");
}

function message(text, type = "success") {
    document.getElementById("message").innerHTML =
        `<div class="alert alert-${type}">${text}</div>`;
}

async function loadStudents() {
    const result = await api("/api/students");

    const students = Array.isArray(result)
        ? result
        : result.students || result.data || [];

    students.forEach(s => {
        const option = document.createElement("option");
        option.value = s._id;
        option.textContent = `${s.name} (${s.registerNumber})`;
        document.getElementById("studentSelect").appendChild(option);
    });
}

async function loadCareer() {
    const id = document.getElementById("studentSelect").value;

    if (!id) return;

    const result = await api(`/api/students/${id}`);

    const s = result.student || result.data || result;
    const career = s.career || {};

    document.getElementById("skills").value =
        Array.isArray(career.skills) ? career.skills.join(", ") : career.skills || "";

    document.getElementById("certifications").value =
        Array.isArray(career.certifications)
            ? career.certifications.join(", ")
            : career.certifications || "";

    document.getElementById("projects").value =
        Array.isArray(career.projects)
            ? career.projects.join(", ")
            : career.projects || "";

    document.getElementById("github").value = career.github || "";
    document.getElementById("linkedin").value = career.linkedin || "";
    document.getElementById("careerGoal").value = career.careerGoal || "";
}

document.getElementById("studentSelect")
    .addEventListener("change", loadCareer);

document.getElementById("careerForm").onsubmit = async function(e) {
    e.preventDefault();

    const id = document.getElementById("studentSelect").value;

    if (!id) {
        message("Select a student first", "warning");
        return;
    }

    const career = {
        career: {
            skills: document.getElementById("skills").value
                .split(",").map(x => x.trim()).filter(Boolean),

            certifications: document.getElementById("certifications").value
                .split(",").map(x => x.trim()).filter(Boolean),

            projects: document.getElementById("projects").value
                .split(",").map(x => x.trim()).filter(Boolean),

            github: document.getElementById("github").value,
            linkedin: document.getElementById("linkedin").value,
            careerGoal: document.getElementById("careerGoal").value
        }
    };

    const result = await api(
        `/api/students/${id}`,
        "PUT",
        career
    );

    if (!result.success) {
        message(result.message || "Unable to update career profile", "danger");
        return;
    }

    message("Career profile updated successfully");
};

loadStudents();
</script>

</body>
</html>
