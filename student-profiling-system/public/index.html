<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Student Profiling System
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #273DB4,
                    #6c63ff
                );

            font-family: Arial, sans-serif;

        }


        .login-card {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.20);

        }


        .title {

            color: #273DB4;

            font-weight: bold;

        }


        .login-button {

            background: #273DB4;

            border: none;

        }


        .login-button:hover {

            background: #1e2e91;

        }


        .demo-box {

            background: #f5f6fa;

            border-radius: 10px;

            padding: 15px;

            margin-top: 20px;

            font-size: 14px;

        }

    </style>

</head>


<body>


<div class="login-card">


    <div class="text-center mb-4">

        <h2 class="title">

            Student Profiling System

        </h2>

        <p class="text-muted">

            Academic, Personal & Career Profile

        </p>

    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- USERNAME -->

        <div class="mb-3">

            <label
                class="form-label"
                for="username">

                Username

            </label>

            <input

                type="text"

                id="username"

                class="form-control"

                placeholder="Enter username"

                autocomplete="username"

                required>

        </div>


        <!-- PASSWORD -->

        <div class="mb-3">

            <label
                class="form-label"
                for="password">

                Password

            </label>

            <input

                type="password"

                id="password"

                class="form-control"

                placeholder="Enter password"

                autocomplete="current-password"

                required>

        </div>


        <!-- ROLE -->

        <div class="mb-4">

            <label
                class="form-label"
                for="role">

                Login As

            </label>

            <select
                id="role"
                class="form-select"
                required>

                <option value="">

                    Select Role

                </option>

                <option value="faculty">

                    Faculty / Mentor

                </option>

                <option value="student">

                    Student

                </option>

            </select>

        </div>


        <!-- LOGIN BUTTON -->

        <button

            type="submit"

            id="loginButton"

            class="btn btn-primary
                   login-button
                   w-100">

            Login

        </button>


    </form>


    <!-- MESSAGE -->

    <div
        id="message"
        class="mt-3 text-center">
    </div>
</div>


<script src="app.js"></script>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document
                .getElementById("username")
                .value
                .trim();


            const password =
                document
                .getElementById("password")
                .value;


            const role =
                document
                .getElementById("role")
                .value;


            const message =
                document
                .getElementById("message");


            const button =
                document
                .getElementById("loginButton");


            // ==========================
            // VALIDATION
            // ==========================

            if (
                !username ||
                !password ||
                !role
            ) {

                message.innerHTML = `

                    <div class="alert alert-warning">

                        Please enter username,
                        password and select role.

                    </div>

                `;

                return;

            }


            button.disabled = true;

            button.innerText =
                "Logging in...";


            message.innerHTML = "";


            try {


                // ==========================
                // LOGIN REQUEST
                // ==========================

                const response =
                    await fetch(
                        "/api/auth/login",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    username:
                                        username,

                                    password:
                                        password,

                                    role:
                                        role

                                })

                        }
                    );


                const result =
                    await response.json();


                console.log(
                    "LOGIN RESPONSE:",
                    result
                );


                // ==========================
                // LOGIN FAILED
                // ==========================

                if (
                    !response.ok ||
                    !result.success
                ) {

                    message.innerHTML = `

                        <div
                            class="alert alert-danger">

                            ${
                                result.message ||
                                "Login failed"
                            }

                        </div>

                    `;

                    button.disabled = false;

                    button.innerText =
                        "Login";

                    return;

                }


                // ==========================
                // SAVE LOGIN
                // ==========================

                localStorage.setItem(
                    "authToken",
                    result.token
                );


                localStorage.setItem(
                    "authUser",
                    JSON.stringify(
                        result.user
                    )
                );


                console.log(
                    "TOKEN SAVED"
                );


                console.log(
                    "USER SAVED:",
                    result.user
                );


                message.innerHTML = `

                    <div
                        class="alert alert-success">

                        Login successful!

                        <br>

                        Opening dashboard...

                    </div>

                `;


                // ==========================
                // REDIRECT
                // ==========================

                setTimeout(
                    function() {

                        if (
                            result.user.role ===
                            "faculty"
                        ) {

                            window.location.href =
                                "/dashboard.html";

                        }

                        else if (
                            result.user.role ===
                            "student"
                        ) {

                            window.location.href =
                                "/student.html";

                        }

                        else {

                            message.innerHTML = `

                                <div
                                    class="alert alert-danger">

                                    Invalid user role.

                                </div>

                            `;

                        }

                    },
                    300
                );


            }

            catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                message.innerHTML = `

                    <div
                        class="alert alert-danger">

                        Unable to connect to
                        the server.

                    </div>

                `;


                button.disabled = false;

                button.innerText =
                    "Login";

            }

        }
    );

</script>


</body>

</html>
