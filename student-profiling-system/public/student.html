
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Student Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Your existing CSS -->
    <link href="style.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-bold">
                🎓 Student Portal
            </span>

            <button id="logout" class="btn btn-outline-light btn-sm">
                Logout
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-4">

        <div id="msg"></div>

        <div class="card shadow-sm">
            <div class="card-body">

                <!-- Student Header -->
                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h3 id="studentName">My Profile</h3>
                        <p id="studentMeta" class="text-muted"></p>
                    </div>

                    <span class="badge bg-success">Student</span>

                </div>

                <hr>

                <!-- Student Profile Details -->
                <div id="profile"></div>

                <hr>

                <!-- Download Academic Report Button -->
                <div class="d-flex flex-wrap gap-2">

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="downloadMyReport()">

                        <i class="bi bi-download"></i>
                        Download My Academic Report

                    </button>

                </div>

                <div class="text-muted small mt-2">
                    Download your personal academic profile as a CSV file.
                </div>

            </div>
        </div>

    </div>

    <!-- Existing App JavaScript -->
    <script src="app.js"></script>

    <script>

        // -----------------------------------------
        // STUDENT AUTHENTICATION
        // -----------------------------------------

        if (!getToken() || currentUser()?.role !== 'student') {
            location.href = 'index.html';
        }

        // -----------------------------------------
        // LOGOUT
        // -----------------------------------------

        document.getElementById('logout').onclick = () => {

            localStorage.removeItem('authToken');
            localStorage.removeItem('authUser');

            location.href = 'index.html';
        };

        // -----------------------------------------
        // PROFILE ROW HELPER
        // -----------------------------------------

        function row(a, b) {

            return `
                <div class="col-md-4 mb-3">

                    <div class="text-muted small">
                        ${a}
                    </div>

                    <div class="fw-semibold">
                        ${b || '-'}
                    </div>

                </div>
            `;
        }

        // -----------------------------------------
        // LOAD STUDENT PROFILE
        // -----------------------------------------

        async function load() {

            try {

                const r = await api('/api/auth/me');

                if (!r.success) {

                    document.getElementById('msg').innerHTML = `
                        <div class="alert alert-danger">
                            ${r.message || 'Unable to load profile'}
                        </div>
                    `;

                    return;
                }

                const s = r.student;

                if (!s) {

                    document.getElementById('msg').innerHTML = `
                        <div class="alert alert-warning">
                            Student profile not found.
                        </div>
                    `;

                    return;
                }

                // Student name and details
                document.getElementById('studentName').textContent =
                    s.name || 'My Profile';

                document.getElementById('studentMeta').textContent =
                    `${s.registerNumber || '-'} • ${s.department || '-'}-${s.section || '-'}`;

                // Student profile objects
                const f = s.family || {};
                const t = s.technical || {};
                const e = s.selfEvaluation || {};
                const c = s.careerGoal || {};

                const sems = s.semesters || [];
                const ars = s.arrears || [];

                // -----------------------------------------
                // DISPLAY PROFILE
                // -----------------------------------------

                document.getElementById('profile').innerHTML = `

                    <!-- PERSONAL DETAILS -->

                    <h5>Personal Details</h5>

                    <div class="row">

                        ${row('Register Number', s.registerNumber)}

                        ${row('Department', s.department)}

                        ${row('Section', s.section)}

                        ${row('Category', s.studentCategory)}

                        ${row('Institutional Email', s.institutionalEmail)}

                        ${row('Mobile', s.mobile)}

                    </div>


                    <!-- ACADEMIC PROGRESS -->

                    <h5>Academic Progress</h5>

                    <div class="table-responsive">

                        <table class="table table-bordered table-striped">

                            <thead class="table-light">

                                <tr>
                                    <th>Semester</th>
                                    <th>SGPA</th>
                                    <th>CGPA</th>
                                    <th>Attendance</th>
                                    <th>Arrears</th>
                                </tr>

                            </thead>

                            <tbody>

                                ${
                                    sems.length > 0
                                    ?
                                    sems.map(x => `
                                        <tr>

                                            <td>
                                                ${x.semester ?? '-'}
                                            </td>

                                            <td>
                                                ${x.sgpa ?? '-'}
                                            </td>

                                            <td>
                                                ${x.cgpa ?? '-'}
                                            </td>

                                            <td>
                                                ${x.attendance ?? '-'}%
                                            </td>

                                            <td>
                                                ${x.numberOfArrears ?? 0}
                                            </td>

                                        </tr>
                                    `).join('')
                                    :
                                    `
                                        <tr>
                                            <td colspan="5" class="text-center">
                                                No academic records available.
                                            </td>
                                        </tr>
                                    `
                                }

                            </tbody>

                        </table>

                    </div>


                    <!-- TECHNICAL PROFILE -->

                    <h5>Technical Profile</h5>

                    <div class="row">

                        ${row('Programming Languages', t.programmingLanguages)}

                        ${row('Technical Skills', t.technicalSkills)}

                        ${row('Area of Interest', t.areaOfInterest)}

                        ${row('Certifications', t.certifications)}

                        ${row('Projects', t.projects)}

                        ${row('Communication', t.communicationLevel)}

                    </div>


                    <!-- SELF EVALUATION -->

                    <h5>Self Evaluation</h5>

                    <div class="row">

                        ${row('Academic Strengths', e.academicStrengths)}

                        ${row('Technical Strengths', e.technicalStrengths)}

                        ${row('Improvement Areas', e.improvementAreas)}

                        ${row('Skills to Develop', e.skillsToDevelop)}

                        ${row('Mentor Support', e.mentorSupport)}

                    </div>


                    <!-- CAREER GOAL -->

                    <h5>Career Goal</h5>

                    <div class="row">

                        ${row('Primary Goal', c.primary)}

                        ${row('Short-term Goal', c.shortTermGoal)}

                        ${row('Long-term Goal', c.longTermGoal)}

                    </div>

                `;

            } catch (error) {

                console.error(error);

                document.getElementById('msg').innerHTML = `
                    <div class="alert alert-danger">
                        Error loading student profile.
                    </div>
                `;

            }

        }


        // -----------------------------------------
        // DOWNLOAD MY ACADEMIC REPORT
        // -----------------------------------------

        async function downloadMyReport() {

            try {

                const token = localStorage.getItem("authToken");

                // Check login token
                if (!token) {

                    alert("Please login again to download your report.");

                    location.href = "index.html";

                    return;
                }

                // Call backend download API
                const response = await fetch(
                    "/api/students/my-profile/download",
                    {
                        method: "GET",

                        headers: {
                            Authorization: "Bearer " + token
                        }
                    }
                );

                // Handle backend errors
                if (!response.ok) {

                    let errorMessage = "Unable to download your report";

                    try {

                        const error = await response.json();

                        errorMessage = error.message || errorMessage;

                    } catch (e) {

                        // Response was not JSON

                    }

                    alert(errorMessage);

                    return;
                }

                // Convert response to downloadable file
                const blob = await response.blob();

                const url = URL.createObjectURL(blob);

                // Create temporary download link
                const link = document.createElement("a");

                link.href = url;

                link.download = "my_student_report.csv";

                document.body.appendChild(link);

                link.click();

                // Clean up
                link.remove();

                URL.revokeObjectURL(url);

            } catch (error) {

                console.error(error);

                alert("Error downloading your report");

            }

        }


        // -----------------------------------------
        // INITIALIZE STUDENT DASHBOARD
        // -----------------------------------------

        load();

    </script>

</body>
</html>
